<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yThay</title>
<meta name="theme-color" content="#ff4d4d">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
#view-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 1000;
    color: white; font-size: 24px; cursor: pointer;
    display: none; transition: transform 0.3s ease, opacity 0.3s ease;
    text-shadow: 0 0 10px rgba(0,0,0,0.5); opacity: 0.8;
}
#view-toggle:hover { transform: scale(1.1); opacity: 1; }
#content, #badges-container, #volume-control, #bg-video {
    transition: opacity 0.3s ease, filter 0.3s ease;
}
</style>
</head>
<body>
<video id="bg-video" autoplay loop muted playsinline>
<source src="source/video.mp4" type="video/mp4">
</video>
<audio id="bg-audio" loop>
<source src="source/sound.mp3" type="audio/mp3">
</audio>

<div id="overlay" onclick="startExperience()">
<div class="click-text"> 🏳️‍⚧️ </div>
</div>
<div id="view-toggle" title="Ocultar/Mostrar Interface">
    <i class="fas fa-eye" id="view-icon"></i>
</div>
<div id="volume-control">
<i class="fas fa-volume-up" id="volume-icon" style="cursor: pointer;"></i>
<input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
</div>
<div id="content">
<img src="source/avatar.png" alt="Avatar Sayuri" class="avatar">
<div class="username">yThay</div>
<div class="bio">
🏳️‍⚧️ Player de Minecraft 🏳️‍⚧️<br>
<div class="sub-counter" id="yt-counter" style="display: flex;">
<i class="fas fa-code"></i> <span>Hm</span>
</div>
</div>
<div class="social-links">
<a href="https://github.com/" target="_blank"><i class="fab fa-github" title="GitHub"></i></a>
<a href="https://discord.com/" target="_blank"><i class="fab fa-discord" title="Discord"></i></a>
<a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube" title="YouTube"></i></a>
</div>
</div> 
<script>
function startExperience() {
  var overlay = document.getElementById('overlay');
  var content = document.getElementById('content');
  var volumeControl = document.getElementById('volume-control');
  var viewToggle = document.getElementById('view-toggle');
  var video = document.getElementById('bg-video');
  var audio = document.getElementById('bg-audio');
  overlay.style.opacity = '0';
  setTimeout(function() { overlay.style.display = 'none'; }, 500);
  content.style.display = 'block';
  volumeControl.style.display = 'flex';
  viewToggle.style.display = 'block';
  setTimeout(function() {
    content.style.opacity = '1';
    volumeControl.style.opacity = '1';
  }, 100);
  
  video.play();
  video.style.filter = "brightness(0.5)";
  audio.volume = 1.0; 
  audio.play().catch(e => console.log("Áudio bloqueado pelo navegador"));
}
var volumeSlider = document.getElementById('volume-slider');
var audio = document.getElementById('bg-audio');
var volumeIcon = document.getElementById('volume-icon');
var ultimoVolume = 1.0;
volumeSlider.addEventListener('input', function() {
  audio.volume = this.value;
  if (this.value > 0) ultimoVolume = this.value;
  atualizarIcone(this.value);
});
volumeIcon.addEventListener('click', function() {
  if (audio.volume > 0) {
    audio.volume = 0; volumeSlider.value = 0; atualizarIcone(0);
  } else {
    var volumeParaVoltar = ultimoVolume > 0 ? ultimoVolume : 1.0;
    audio.volume = volumeParaVoltar; volumeSlider.value = volumeParaVoltar; atualizarIcone(volumeParaVoltar);
  }
});
function atualizarIcone(valor) {
  if (valor == 0) volumeIcon.className = 'fas fa-volume-mute';
  else if (valor < 0.5) volumeIcon.className = 'fas fa-volume-down';
  else volumeIcon.className = 'fas fa-volume-up'; 
}
function aplicarInclinacao(e) {
  var content = document.getElementById("content");
  if (content.style.display === 'block') {
    var rect = content.getBoundingClientRect();
    var centroX = rect.left + rect.width / 2;
    var centroY = rect.top + rect.height / 2;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var distanciaX = clientX - centroX;
    var distanciaY = clientY - centroY;
    var inclinacaoX = distanciaY / 25; 
    var inclinacaoY = -(distanciaX / 25);
    content.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${inclinacaoX}deg) rotateY(${inclinacaoY}deg)`;
  }
}
document.addEventListener("mousemove", aplicarInclinacao);
document.addEventListener("touchmove", aplicarInclinacao);
function removerInclinacao() {
  var content = document.getElementById("content");
  if (content.style.display === 'block') {
    content.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(0deg) rotateY(0deg)`;
  }
}
document.addEventListener("mouseleave", removerInclinacao);
document.addEventListener("touchend", removerInclinacao);
var isUIHidden = false;
function atualizarVisualizacao() {
  var video = document.getElementById('bg-video');
  var content = document.getElementById('content');
  var volumeControl = document.getElementById('volume-control');
  var viewIcon = document.getElementById('view-icon');
  var overlay = document.getElementById('overlay');
  if (overlay.style.display !== 'none') return;
  if (isUIHidden) {
    if (video) video.style.filter = "brightness(1)";
    if (content) { content.style.opacity = '0'; content.style.pointerEvents = 'none'; }
    if (volumeControl) { volumeControl.style.opacity = '0'; volumeControl.style.pointerEvents = 'none'; }
    if (viewIcon) viewIcon.className = 'fas fa-eye-slash'; 
  } else {
    if (video) video.style.filter = "brightness(0.5)";
    if (content) { content.style.opacity = '1'; content.style.pointerEvents = 'auto'; }
    if (volumeControl) { volumeControl.style.opacity = '1'; volumeControl.style.pointerEvents = 'auto'; }
    if (viewIcon) viewIcon.className = 'fas fa-eye';
  }
}
document.getElementById('view-toggle').addEventListener('click', function() {
  isUIHidden = !isUIHidden;
  atualizarVisualizacao();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault(); 
    if (e.repeat) return;
    isUIHidden = !isUIHidden; 
    atualizarVisualizacao();
  }
});
</script>
</body>
</html>
