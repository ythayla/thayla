<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Jogo Da Cobrinha Gulosa</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
            color: #4caf50;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 20px;
        }
        canvas {
            background-color: #000000;
            border: 2px solid #333333;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
            border-radius: 4px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🐍 Cobrinha Gulosa</h1>
    <div id="score-board">Pontuação: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">Use as <b>setas do teclado</b> para controlar.</div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const gridSize = 20;
        let count = 0;
        let score = 0;
        let snake = {
            x: 160,
            y: 160,
            dx: gridSize,
            dy: 0,
            cells: [],
            maxCells: 4
        };
        let food = {
            x: 320,
            y: 160
        };
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }
        function resetGame() {
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = gridSize;
            snake.dy = 0;
            score = 0;
            scoreElement.innerText = score;
            spawnFood();
        }
        function spawnFood() {
            food.x = getRandomInt(0, 20) * gridSize;
            food.y = getRandomInt(0, 20) * gridSize;
        }
        function loop() {
            requestAnimationFrame(loop);
            if (++count < 4) {
                return;
            }
            count = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            snake.x += snake.dx;
            snake.y += snake.dy;
            if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
                resetGame();
            }
            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }
            ctx.fillStyle = '#ff3b30';
            ctx.fillRect(food.x, food.y, gridSize - 1, gridSize - 1);
            ctx.fillStyle = '#4caf50';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, gridSize - 1, gridSize - 1);
                if (cell.x === food.x && cell.y === food.y) {
                    snake.maxCells++;
                    score += 10;
                    scoreElement.innerText = score;
                    spawnFood();
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        resetGame();
                    }
                }
            });
        }
        document.addEventListener('keydown', function(e) {
            if([37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
            if (e.keyCode === 37 && snake.dx === 0) {
                snake.dx = -gridSize;
                snake.dy = 0;
            }
            else if (e.keyCode === 38 && snake.dy === 0) {
                snake.dy = -gridSize;
                snake.dx = 0;
            }
            else if (e.keyCode === 39 && snake.dx === 0) {
                snake.dx = gridSize;
                snake.dy = 0;
            }
            else if (e.keyCode === 40 && snake.dy === 0) {
                snake.dy = gridSize;
                snake.dx = 0;
            }
        });
        requestAnimationFrame(loop);
    </script>
</body>
</html>
